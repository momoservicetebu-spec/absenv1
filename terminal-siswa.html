<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Gate Masuk - Absensi Siswa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  
  <!-- PEMANGGILAN CSS BAWAAN -->
  <link rel="stylesheet" href="./css/terminal.css">
  
  <!-- CSS TAMBAHAN: MODERN UI & ANIMASI BACKGROUND -->
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #1e3c72, #2a5298, #0f2027, #203a43);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
    }

    h2 { margin-top: 0; margin-bottom: 12px; font-weight: 600; letter-spacing: 1px; color: #fff; }

    /* Styling Dropdown Pilihan Pos Gerbang */
    #pilihPosGerbang {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(15, 32, 39, 0.75);
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      margin-bottom: 14px;
      transition: 0.3s;
    }
    #pilihPosGerbang:hover, #pilihPosGerbang:focus {
      border-color: #4facfe;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.4);
    }
    #pilihPosGerbang option {
      background: #1e3c72;
      color: #ffffff;
    }
    
    /* Styling Input NFC / Barcode */
    #nfcSimulator {
      width: 90%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255, 255, 255, 0.95);
      font-size: 16px;
      text-align: center;
      transition: all 0.3s;
    }
    #nfcSimulator:focus { outline: none; border-color: #4facfe; box-shadow: 0 0 10px rgba(79, 172, 254, 0.5); }
    
    .status { font-weight: bold; margin-bottom: 15px; font-size: 1.1em; }
    #gpsStatusText { color: #ff6b6b !important; }
    
    /* Tombol GPS & Login */
    .gps-btn, .login-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .gps-btn:hover, .login-btn:hover { background: rgba(255, 255, 255, 0.3); }
    hr { border-color: rgba(255,255,255,0.1); margin: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎓 Terminal Absensi Siswa</h2>

    <!-- PILIHAN POS GERBANG OTOMATIS TERSIMPAN DI PERANGKAT -->
    <div>
      <select id="pilihPosGerbang" title="Pilih Pos Gerbang Perangkat Ini">
        <option value="GERBANG-1">📍 Pos: Gerbang 1 (Utama)</option>
        <option value="GERBANG-2">📍 Pos: Gerbang 2</option>
        <option value="GERBANG-3">📍 Pos: Gerbang 3</option>
        <option value="GERBANG-4">📍 Pos: Gerbang 4</option>
        <option value="GERBANG-5">📍 Pos: Gerbang 5</option>
      </select>
    </div>

    <div class="status" id="statusText" style="color: #feca57;">Memuat Data Siswa...</div>
    
    <!-- Tombol Verifikasi Lokasi -->
    <button class="gps-btn" id="btnGps" onclick="prosesAbsensiGPS()">📍 Verifikasi Lokasi Perangkat</button>
    <p id="gpsStatusText" style="font-size: 13px; font-weight:bold; margin-top: 10px; margin-bottom: 15px;">Sistem terkunci. Verifikasi GPS dibutuhkan.</p>

    <div id="standby-ui">
      <p style="font-size: 14px; opacity: 0.8;"><b>Tap Kartu RFID / Scan Barcode Siswa</b></p>
      
      <div class="method-box" id="boxNfc">
        <input type="text" id="nfcSimulator" placeholder="📡 Fokus di sini & Scan Barcode / Kartu" disabled autocomplete="off">
      </div>
    </div>

    <div class="alert-box" id="alertBox" style="display: none; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: bold;"></div>
    <hr>
    <a href="login.html" class="login-btn">⚙️ Masuk ke Dashboard Admin</a>
  </div>

  <!-- PENANDA ROLE TERMINAL UNTUK JAVASCRIPT -->
  <script>
    const TERMINAL_ROLE = "SISWA";
  </script>
  <script src="./js/config.js?v=5.0"></script>
  <script src="./js/api.js?v=5.0"></script>
  <script src="./js/pages/geofencing.js?v=5.0"></script>
  <script src="./js/pages/attendance-siswa.js?v=1.1"></script>
</body>
</html>
