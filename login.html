<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SIS Absensi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body { 
      font-family: 'Inter', Tahoma, sans-serif; 
      /* Warna background hijau tosca sesuai gambar */
      background-color: #88cebc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Utama (Split screen) */
    .login-wrapper {
      display: flex;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 900px;
      min-height: 550px;
      overflow: hidden;
    }

    /* Bagian Kiri (Form) */
    .left-panel {
      flex: 1;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #ffffff;
    }
    
    .brand-logo {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #1a1a1a;
      margin-bottom: 30px;
    }
    .brand-logo svg {
      margin-right: 10px;
      width: 24px;
      height: 24px;
    }

    .left-panel h2 { 
      color: #111; 
      font-size: 26px;
      margin-bottom: 8px;
    }
    .left-panel p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .input-group { 
      margin-bottom: 18px; 
      text-align: left; 
    }
    .input-group label { 
      display: block; 
      font-size: 13px; 
      color: #555; 
      margin-bottom: 6px; 
      font-weight: 500;
    }
    
    .input-wrapper {
      position: relative;
    }
    .input-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: #888;
    }
    .input-wrapper input { 
      width: 100%; 
      padding: 12px 12px 12px 38px; /* Padding kiri untuk ikon */
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 14px; 
      transition: all 0.2s;
    }
    .input-wrapper input:focus {
      border-color: #3f2a7a;
      outline: none;
      box-shadow: 0 0 0 3px rgba(63, 42, 122, 0.1);
    }
    
    .forgot-password {
      display: block;
      text-align: right;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      margin-top: 6px;
    }
    .forgot-password:hover { text-decoration: underline; }

    /* Tombol-tombol */
    .btn-login { 
      width: 100%; 
      padding: 12px; 
      /* Warna ungu gelap sesuai gambar */
      background-color: #342168; 
      color: white; 
      border: none; 
      border-radius: 25px; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 15px; 
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { background-color: #897db0; cursor: not-allowed; }

    .btn-google {
      width: 100%;
      padding: 12px;
      background-color: white;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .btn-google:hover { background-color: #f9f9f9; }
    .btn-google img { width: 18px; margin-right: 10px; }

    .error-text { 
      color: #dc3545; 
      font-size: 13px; 
      text-align: center; 
      margin-top: 10px; 
      display: none; 
      background: #ffe6e6;
      padding: 8px;
      border-radius: 6px;
    }

    /* Footer / Bottom Links */
    .bottom-links {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
    }
    .bottom-links a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .bottom-links a:hover { text-decoration: underline; }
    .register-text { color: #666; margin-top: 10px; }
    .register-text a { display: inline; color: #342168; font-weight: 600; }

    /* Bagian Kanan (Ilustrasi) */
    .right-panel {
      flex: 1;
      background-color: #f4f0fa; /* Warna background ungu super muda */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    .right-panel h3 {
      font-weight: 400;
      color: #333;
      font-size: 16px;
      margin-bottom: 5px;
    }
    .right-panel h1 {
      font-size: 32px;
      color: #111;
      margin-bottom: 30px;
    }
    .illustration {
      max-width: 100%;
      height: auto;
      /* Anda bisa meletakkan URL gambar ilustrasi Anda di sini di tag <img> nanti */
    }

    /* Responsif untuk layar HP */
    @media (max-width: 768px) {
      .login-wrapper { flex-direction: column; }
      .right-panel { display: none; /* Sembunyikan ilustrasi di layar kecil agar fokus ke form */ }
      .left-panel { padding: 30px; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="left-panel">
      
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
        SIS Absensi
      </div>

      <h2>Portal Akses</h2>
      <p class="subtitle">Silakan masuk dengan kredensial terdaftar Anda.</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input type="text" id="username" placeholder="Masukkan Username" required autocomplete="off">
          </div>
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            <input type="password" id="password" placeholder="Masukkan Password" required autocomplete="off">
          </div>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="button" class="btn-login" id="btnLogin" onclick="processLogin()">Masuk</button>
        
        <button type="button" class="btn-google">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
          Sign in with Google
        </button>

        <div class="error-text" id="errorMsg"></div>
      </form>

      <div class="bottom-links">
        <a href="index.html">← Kembali ke Gerbang Utama</a>
        <p class="register-text">Belum punya akun? <a href="#">Daftar</a></p>
      </div>
    </div>

    <div class="right-panel">
      <h3>Senang melihat Anda kembali,</h3>
      <h1>Selamat Datang</h1>
      <img class="illustration" src="https://i.ibb.co/3s67Cvw/illustration-placeholder.png" alt="Ilustrasi Absensi" style="width: 80%; max-width: 350px;">
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxx3BLAOh7RZwF2vvukhDPhytbAPXfMP3H_RAJNeWgxLe2LNcCzojm-6HQ1kktPQMTQ/exec";

    async function processLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnLogin');
      const errMsg = document.getElementById('errorMsg');
      
      if(user === "" || pass === "") {
        showError("Username dan Password wajib diisi!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Memverifikasi...";
      errMsg.style.display = "none";

      try {
        const formData = new URLSearchParams();
        formData.append("action", "login");
        formData.append("username", user);
        formData.append("password", pass);

        const response = await fetch(GAS_URL, { method: "POST", body: formData });
        const result = await response.json();

        if (result.success) {
          btn.style.backgroundColor = "#342168"; // Disesuaikan dengan warna tema baru
          btn.innerText = "Halo, " + result.name + "!";
          
          setTimeout(function() {
            if (result.role === "admin") {
              window.location.href = "dashboard-admin.html";
            } else {
              alert("Login Sukses! Anda masuk sebagai: " + result.role + ". Halaman ini belum dibuat.");
              btn.disabled = false;
              btn.innerText = "Masuk";
              btn.style.backgroundColor = "#342168"; // Disesuaikan dengan warna tema baru
            }
          }, 1000);

        } else {
          showError(result.message);
          btn.disabled = false;
          btn.innerText = "Masuk";
        }
      } catch (err) {
        showError("Terjadi kesalahan jaringan.");
        btn.disabled = false;
        btn.innerText = "Masuk";
      }
    }

    function showError(text) {
      const errMsg = document.getElementById('errorMsg');
      errMsg.innerText = text;
      errMsg.style.display = "block";
    }
  </script>
</body>
</html>
