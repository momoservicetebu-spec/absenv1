<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SIS Absensi Biometrik</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #60ab9a 0%, #80cbb7 50%, #4a8f7f 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
    }

    /* Card Container Utama */
    .login-wrapper {
      display: flex;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 920px;
      min-height: 550px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Panel Kiri (Form Login) */
    .left-panel {
      flex: 1;
      padding: 45px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #ffffff;
    }
    
    .brand-logo {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 19px;
      color: #1a1a1a;
      margin-bottom: 28px;
    }
    .brand-logo svg {
      margin-right: 10px;
      width: 28px;
      height: 28px;
      fill: #3b2667;
    }

    .left-panel h2 { 
      color: #111111; 
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .left-panel p.subtitle {
      color: #666666;
      font-size: 13.5px;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .input-group { 
      margin-bottom: 16px; 
      text-align: left; 
    }
    .input-group label { 
      display: block; 
      font-size: 12.5px; 
      color: #555555; 
      margin-bottom: 6px; 
      font-weight: 600;
    }
    
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: #888888;
    }
    .input-wrapper input { 
      width: 100%; 
      padding: 12px 40px 12px 40px; 
      border: 1px solid #dcdcdc; 
      border-radius: 10px; 
      font-size: 14px; 
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fcfcfc;
    }
    .input-wrapper input:focus {
      border-color: #3b2667;
      background-color: #ffffff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 38, 103, 0.12);
    }
    
    /* Tombol Toggle Eye Password */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: #888888;
      cursor: pointer;
      transition: fill 0.2s;
    }
    .toggle-password:hover {
      fill: #3b2667;
    }
    
    .forgot-password {
      display: block;
      text-align: right;
      font-size: 12px;
      color: #666666;
      text-decoration: none;
      margin-top: 6px;
      font-weight: 500;
    }
    .forgot-password:hover { 
      color: #3b2667;
      text-decoration: underline; 
    }

    /* Tombol Utama */
    .btn-login { 
      width: 100%; 
      padding: 14px; 
      background-color: #3b2667; 
      color: white; 
      border: none; 
      border-radius: 30px; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 22px; 
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(59, 38, 103, 0.25);
    }
    .btn-login:hover { 
      background-color: #2a1b4e;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59, 38, 103, 0.35);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled { 
      background-color: #8b79a5; 
      cursor: not-allowed; 
      box-shadow: none;
    }

    .error-text { 
      color: #dc3545; 
      font-size: 13px; 
      text-align: center; 
      margin-top: 14px; 
      display: none; 
      background: #ffe6e6;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ffcccc;
    }

    /* Link Bawah */
    .bottom-links {
      margin-top: 28px;
      text-align: center;
      font-size: 13.5px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .bottom-links a.back-link {
      color: #444444;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .bottom-links a.back-link:hover { 
      background-color: #f0ecf7;
      color: #3b2667;
    }
    .register-text { 
      color: #666666; 
      font-size: 13px;
    }
    .register-text a { 
      color: #3b2667; 
      font-weight: 700; 
      text-decoration: none; 
      margin-left: 3px;
    }
    .register-text a:hover { 
      text-decoration: underline; 
    }

    /* Panel Kanan (Ilustrasi Biometrik Vector) */
    .right-panel {
      flex: 1.1;
      background: linear-gradient(135deg, #f3eefb 0%, #e5daf7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      text-align: center;
      position: relative;
    }
    .right-panel h3 {
      font-weight: 500;
      color: #555555;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .right-panel h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1b0e36;
      margin-bottom: 20px;
    }
    .illustration-box {
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Responsif Layar Smartphone */
    @media (max-width: 820px) {
      .login-wrapper { flex-direction: column; max-width: 440px; }
      .right-panel { display: none; }
      .left-panel { padding: 35px 28px; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Panel Kiri: Form Login -->
    <div class="left-panel">
      
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
        </svg>
        SIS Absensi Biometrik
      </div>

      <h2>Portal Akses</h2>
      <p class="subtitle">Silakan masuk dengan kredensial terdaftar Anda.</p>

      <form id="loginForm" onsubmit="event.preventDefault(); processLogin();">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <input type="text" id="username" placeholder="Masukkan Username" required autocomplete="username">
          </div>
        </div>
        
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
            </svg>
            <input type="password" id="password" placeholder="Masukkan Password" required autocomplete="current-password">
            <svg class="toggle-password" id="togglePassword" viewBox="0 0 24 24">
              <path id="eyeIcon" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </div>
          <a href="javascript:void(0)" onclick="alert('Silakan hubungi Administrator Sekolah untuk reset password Anda.')" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
        <div class="error-text" id="errorMsg"></div>
      </form>

      <div class="bottom-links">
        <a href="index.html" class="back-link">
          <span>←</span> Kembali ke Gerbang Utama Terminal Absen
        </a>
        <p class="register-text">
          Belum punya akun? <a href="javascript:void(0)" onclick="alert('Pendaftaran akun Admin/Operator baru hanya dapat dilakukan oleh Super Administrator Sekolah.')">Daftar</a>
        </p>
      </div>
    </div>

    <!-- Panel Kanan: Ilustrasi Vektor Biometrik Presensi -->
    <div class="right-panel">
      <h3>Senang melihat Anda kembali,</h3>
      <h1>Selamat Datang</h1>
      <div class="illustration-box">
        <svg viewBox="0 0 400 320" style="width: 100%; height: auto;" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradKiosk" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b2667" />
              <stop offset="100%" stop-color="#1b0e36" />
            </linearGradient>
            <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#2a1b4e" />
              <stop offset="100%" stop-color="#130a2a" />
            </linearGradient>
          </defs>

          <!-- Shadow Base -->
          <ellipse cx="200" cy="280" rx="100" ry="14" fill="#d0c2e8"/>

          <!-- Decorative Tech Circles -->
          <circle cx="200" cy="150" r="125" fill="none" stroke="#bda6e8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>
          <circle cx="200" cy="150" r="142" fill="none" stroke="#3b2667" stroke-width="1" stroke-dasharray="2,8" opacity="0.3"/>

          <!-- Main Biometric Kiosk Device -->
          <rect x="135" y="40" width="130" height="225" rx="18" fill="url(#gradKiosk)"/>
          <rect x="142" y="47" width="116" height="211" rx="14" fill="#241445"/>

          <!-- Kiosk Display Screen -->
          <rect x="148" y="56" width="104" height="140" rx="8" fill="url(#screenGlow)"/>
          <rect x="148" y="56" width="104" height="140" rx="8" stroke="#00b894" stroke-width="1.5" fill="none" opacity="0.7"/>

          <!-- Camera AI Lens (Top) -->
          <circle cx="200" cy="68" r="5" fill="#00b894"/>
          <circle cx="200" cy="68" r="2" fill="#ffffff"/>

          <!-- Face Recognition HUD Target -->
          <!-- Face Silhouette -->
          <path d="M 186,98 A 14,16 0 0,0 214,98 C 214,112 207,122 200,125 C 193,122 186,112 186,98 Z" fill="none" stroke="#80cbb7" stroke-width="2" stroke-dasharray="3,2"/>
          <circle cx="193" cy="98" r="2" fill="#00b894"/>
          <circle cx="207" cy="98" r="2" fill="#00b894"/>
          
          <!-- HUD Corner Brackets -->
          <path d="M 172,82 L 172,75 L 179,75" fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 228,82 L 228,75 L 221,75" fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 172,122 L 172,129 L 179,129" fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 228,122 L 228,129 L 221,129" fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>
          
          <!-- Scan Beam Line -->
          <line x1="168" y1="102" x2="232" y2="102" stroke="#00e676" stroke-width="2" opacity="0.9"/>

          <!-- Verification Badge on Display -->
          <rect x="160" y="148" width="80" height="18" rx="9" fill="#00b894"/>
          <text x="200" y="160" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">FACE MATCHED</text>

          <!-- Fingerprint & Card Sensor Panel (Bottom Part) -->
          <rect x="156" y="208" width="88" height="36" rx="8" fill="#170c2e" stroke="#4a327a" stroke-width="1.5"/>
          
          <!-- Fingerprint Icon Glow -->
          <g transform="translate(164, 213)">
            <path d="M 12,4 A 8,8 0 0,1 20,12 A 8,8 0 0,1 18,18 M 8,8 A 12,12 0 0,1 24,8 M 12,12 A 4,4 0 0,1 16,12 A 4,4 0 0,1 15,16" fill="none" stroke="#00b894" stroke-width="1.8" stroke-linecap="round"/>
          </g>

          <!-- RFID Tap Signal Wave -->
          <g transform="translate(206, 217)">
            <path d="M 6,3 A 6,6 0 0,1 6,17 M 11,0 A 11,11 0 0,1 11,20" fill="none" stroke="#80cbb7" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- Floating Smart Card (NFC/RFID Badge) -->
          <g transform="translate(-15, -10)">
            <rect x="85" y="150" width="50" height="34" rx="5" fill="#ffffff" stroke="#3b2667" stroke-width="2" transform="rotate(-12 85 150)"/>
            <rect x="92" y="156" width="12" height="12" rx="6" fill="#00b894" transform="rotate(-12 85 150)"/>
            <line x1="108" y1="158" x2="126" y2="154" stroke="#3b2667" stroke-width="3" stroke-linecap="round"/>
            <line x1="109" y1="165" x2="122" y2="162" stroke="#a48fd4" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- Script Login Terupdate -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxx3BLAOh7RZwF2vvukhDPhytbAPXfMP3H_RAJNeWgxLe2LNcCzojm-6HQ1kktPQMTQ/exec";

    async function processLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnLogin');
      const errMsg = document.getElementById('errorMsg');
      
      if (user === "" || pass === "") {
        showError("Username dan Password wajib diisi!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Memverifikasi...";
      errMsg.style.display = "none";

      try {
        const formData = new URLSearchParams();
        formData.append("action", "login");
        formData.append("username", user);
        formData.append("password", pass);

        const response = await fetch(GAS_URL, { method: "POST", body: formData });
        const result = await response.json();

        if (result.success) {
          btn.style.backgroundColor = "#00b894";
          btn.innerText = "Halo, " + (result.name || result.nama || user) + "!";
          
          const rawRole = result.role || 'Operator';
          const formattedRole = rawRole.charAt(0).toUpperCase() + rawRole.slice(1);
          const displayName = result.name || result.nama || user;

          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('role', formattedRole);
          localStorage.setItem('username', user);
          localStorage.setItem('name', displayName);
          localStorage.setItem('login_timestamp', Date.now().toString()); // <-- TAMBAHKAN BARIS INI

          const sessionData = {
            isLoggedIn: true,
            role: formattedRole,
            name: displayName,
            username: user,
            loginTime: Date.now()
          };
          localStorage.setItem('user_session', JSON.stringify(sessionData));

          setTimeout(function() {
            window.location.replace("dashboard-admin.html");
          }, 800);

        } else {
          showError(result.message || "Username atau password salah.");
          btn.disabled = false;
          btn.innerText = "Masuk";
        }

      } catch (err) {
        showError("Terjadi kesalahan jaringan.");
        btn.disabled = false;
        btn.innerText = "Masuk";
      }
    }

    function showError(text) {
      const errMsg = document.getElementById('errorMsg');
      errMsg.innerText = text;
      errMsg.style.display = "block";
    }

    // Toggle Password Visibility Logic
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('d', 'M11.83 9L15 12.16V12a3 3 0 0 0-3-3h-.17zm-4.3.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.3-3.8c4.29 0 7.97 2.34 9.66 5.99-.44.95-1 1.83-1.66 2.6l-1.46-1.46C19.14 11.82 19.85 10.7 20.31 9.5c-1.48-3.32-4.85-5.69-8.59-5.69-1.22 0-2.4.24-3.48.67l1.55 1.55c.61-.17 1.25-.26 1.93-.26zM2.81 2.81L1.39 4.22l3.4 3.4C3.17 8.87 1.55 10.74 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l2.4 2.4 1.41-1.41L2.81 2.81z');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('d', 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z');
      }
    });
  </script>
</body>
</html>
