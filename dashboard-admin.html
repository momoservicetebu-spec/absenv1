<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - SIS Absensi</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; }
    .sidebar { width: 250px; background-color: #343a40; color: white; height: 100vh; padding: 20px; box-sizing: border-box; }
    .sidebar h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #4f5962; padding-bottom: 10px; }
    .sidebar a { color: #c2c7d0; text-decoration: none; display: block; margin: 15px 0; font-size: 16px; font-weight: bold; }
    .sidebar a:hover { color: white; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
    h3 { margin-top: 0; color: #333; }
    
    /* Tabel & Form Import */
    input[type="file"], input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-right: 10px; width: 60%; }
    button { padding: 10px 20px; font-size: 14px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #218838; }
    
    /* Kamera Pendaftaran */
    #video-container { position: relative; display: inline-block; margin-top: 15px; }
    video { border-radius: 10px; background-color: #000; }
    canvas { position: absolute; top: 0; left: 0; border-radius: 10px; }
    .status { margin-top: 10px; font-size: 16px; font-weight: bold; color: #007bff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

  <div class="sidebar">
    <h2>⚙️ Admin Panel</h2>
    <a href="#">📁 Manajemen Data</a>
    <a href="#">📸 Pendaftaran Biometrik</a>
    <a href="#">📊 Laporan Absensi</a>
    <hr style="border-color: #4f5962; margin: 30px 0;">
    <a href="login.html" style="color: #ff6b6b;">🚪 Logout</a>
  </div>

  <div class="main-content">
    
    <div class="card">
      <h3>📁 Import Data Pengguna (CSV/Excel)</h3>
      <p style="color: #666; font-size: 14px;">Unggah data siswa atau guru ke Google Sheets sebelum mendaftarkan wajah mereka.</p>
      <input type="file" id="fileUpload" accept=".csv, .xlsx">
      <button onclick="alert('Fitur parser CSV/Excel ke Google Sheets akan dihubungkan di tahap selanjutnya.')">Proses Import Data</button>
    </div>

    <div class="card">
      <h3>📸 Pendaftaran Wajah Biometrik</h3>
      <div class="status" id="statusText">Memuat Model AI Kamera...</div>
      
      <div id="video-container">
        <video id="video" width="480" height="360" autoplay muted playsinline></video>
      </div>

      <div style="margin-top: 20px;">
        <input type="text" id="userIdInput" placeholder="Masukkan ID User (Contoh: GURU-001)">
        <button onclick="registerCurrentFace()">Daftarkan Wajah Ini</button>
      </div>
    </div>

  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxx3BLAOh7RZwF2vvukhDPhytbAPXfMP3H_RAJNeWgxLe2LNcCzojm-6HQ1kktPQMTQ/exec";
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
    
    const video = document.getElementById('video');
    const statusText = document.getElementById('statusText');
    let lastDescriptor = null;
    let detectionInterval = null;

    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]).then(() => {
      statusText.innerText = "Kamera Pendaftaran Siap!";
      statusText.style.color = "green";
      startVideo();
    }).catch(err => console.error(err));

    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { 
          video.srcObject = stream; 
          startFaceTracking();
        })
        .catch(err => console.error(err));
    }

    function startFaceTracking() {
      const canvas = faceapi.createCanvasFromMedia(video);
      document.getElementById('video-container').append(canvas);
      const displaySize = { width: video.width, height: video.height };
      faceapi.matchDimensions(canvas, displaySize);

      detectionInterval = setInterval(async () => {
        const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                        .withFaceLandmarks()
                                        .withFaceDescriptor();
        
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

        if (detections) {
          lastDescriptor = Array.from(detections.descriptor);
          const resized = faceapi.resizeResults(detections, displaySize);
          faceapi.draw.drawDetections(canvas, resized);
        } else {
          lastDescriptor = null;
        }
      }, 200);
    }

    // FUNGSI LAMA YANG DISELAMATKAN
    async function registerCurrentFace() {
      const userId = document.getElementById('userIdInput').value.trim();
      if (!userId || !lastDescriptor) { 
        alert("Peringatan: Isi ID pengguna dan pastikan kotak biru muncul di wajah Anda!"); 
        return; 
      }

      const btn = document.querySelector('button[onclick="registerCurrentFace()"]');
      btn.innerText = "Menyimpan Data...";
      btn.disabled = true;

      try {
        const formData = new URLSearchParams();
        formData.append("action", "registerFace");
        formData.append("userId", userId);
        formData.append("role", "GURU"); 
        formData.append("embeddingData", JSON.stringify(lastDescriptor));

        const response = await fetch(GAS_URL, { method: "POST", body: formData });
        const result = await response.json();
        
        if (result.success) {
          alert(`Wajah untuk ID ${userId} Berhasil Didaftarkan ke Database!`);
          document.getElementById('userIdInput').value = "";
        } else {
          alert(`Gagal menyimpan: ${result.message}`);
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan saat mengirim data.");
      }
      
      btn.innerText = "Daftarkan Wajah Ini";
      btn.disabled = false;
    }
  </script>
</body>
</html>
