<!DOCTYPE html>
<html>
<head>
  <title>Sistem Absensi Wajah AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
    h2 { color: #333; }
    #video-container { 
      position: relative; 
      display: inline-block; 
      margin-top: 20px; 
      border-radius: 10px; 
      overflow: hidden; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
      background-color: #000;
    }
    video { display: block; }
    .status { margin-top: 15px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h2>Absensi Biometrik Wajah</h2>
  <div class="status" id="statusText">Meminta akses kamera...</div>
  
  <div id="video-container">
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
  </div>

  <script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('statusText');

    function startVideo() {
      // Meminta akses kamera ke browser
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          statusText.innerText = "Kamera aktif! Menunggu integrasi AI...";
          statusText.style.color = "green";
        })
        .catch(err => {
          statusText.innerText = "Gagal mengakses kamera: " + err.message;
          statusText.style.color = "red";
          console.error(err);
        });
    }

    // Jalankan kamera saat halaman dimuat
    window.addEventListener('load', startVideo);
  </script>
</body>
</html>
