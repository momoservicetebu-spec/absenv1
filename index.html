<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Gate Masuk - MFA Absensi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  
  <!-- PEMANGGILAN CSS -->
  <link rel="stylesheet" href="./css/terminal.css">
  
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <div class="card">
    <h2>Terminal Absensi MFA</h2>
    <div class="status" id="statusText" style="color: orange;">Memuat Engine AI...</div>
    
    <!-- Tombol Verifikasi Lokasi -->
    <button class="gps-btn" id="btnGps" onclick="prosesAbsensiGPS()">📍 Verifikasi Lokasi Perangkat Dulu</button>
    <p id="gpsStatusText" style="font-size: 13px; font-weight:bold; color: #dc3545; margin-top: -5px; margin-bottom: 15px;">Sistem terkunci. Verifikasi GPS dibutuhkan.</p>

    <div id="standby-ui">
      <p><b>Pilih Metode Faktor Pertama:</b></p>
      
      <!-- Area NFC (Awalnya Terkunci) -->
      <div class="method-box" id="boxNfc">
        <p style="margin: 0 0 10px 0; font-size: 14px;">📡 Tap Kartu NFC / Scan Barcode</p>
        <input type="text" id="nfcSimulator" placeholder="Fokus di sini & Ketik ID -> Enter" disabled autocomplete="off">
      </div>
      
      <!-- Area Fingerprint (Awalnya Terkunci) -->
      <div class="method-box" id="boxFingerprint">
        <p style="margin: 0 0 10px 0; font-size: 14px;">👆 Fingerprint (Localhost Bridge)</p>
        <button id="btnFingerprint" class="fp-btn" onclick="simulateFingerprintBridge()" disabled>Simulasikan Tempel Jari</button>
        <p id="fingerprintStatus" style="font-size: 13px; font-weight:bold; color: gray; margin-top: 10px;"></p>
      </div>
    </div>

    <div id="video-container">
      <video id="video" width="480" height="360" autoplay muted playsinline></video>
    </div>

    <div class="alert-box" id="alertBox"></div>
    <hr>
    <a href="login.html" class="login-btn">⚙️ Masuk ke Dashboard Login</a>
  </div>

  <!-- PEMANGGILAN SCRIPT -->
  <!-- 1. Script Keamanan Lokasi (Geofencing) -->
  <script src="./js/pages/geofencing.js"></script>
  
  <!-- 2. Script Inti Aplikasi Anda -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/pages/attendance-app.js"></script>
</body>
</html>
