<!DOCTYPE html>
<html>
<head>
  <title>Sistem Absensi Wajah AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
    #video-container { position: relative; display: inline-block; margin-top: 20px; }
    video { border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background-color: #000; }
    canvas { position: absolute; top: 0; left: 0; border-radius: 10px; }
    .status { margin-top: 15px; font-weight: bold; color: #007bff; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

  <h2>Absensi Biometrik Wajah</h2>
  <div class="status" id="statusText">Memuat Model AI... (Harap tunggu)</div>
  
  <div id="video-container">
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
  </div>

  <script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('statusText');
    
    // Menggunakan CDN Raw GitHub Resmi (Lebih Stabil)
    const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

    // Nyalakan Kamera Dulu (Biar layar tidak hitam)
    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { 
          video.srcObject = stream; 
          statusText.innerText = "Kamera aktif! Proses sinkronisasi AI...";
          statusText.style.color = "#d39e00"; // Kuning peringatan
        })
        .catch(err => {
          statusText.innerText = "Gagal mengakses kamera.";
          statusText.style.color = "red";
          console.error(err);
        });
    }

    // Jalankan kamera langsung
    startVideo();

    // Baru muat Model AI di latar belakang
    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]).then(() => {
      statusText.innerText = "AI Aktif & Siap Memindai!";
      statusText.style.color = "green";
      
      video.addEventListener('play', () => {
        const canvas = faceapi.createCanvasFromMedia(video);
        document.getElementById('video-container').append(canvas);
        const displaySize = { width: video.width, height: video.height };
        faceapi.matchDimensions(canvas, displaySize);

        setInterval(async () => {
          const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                                          .withFaceLandmarks()
                                          .withFaceDescriptors();
          
          const resizedDetections = faceapi.resizeResults(detections, displaySize);
          canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
          faceapi.draw.drawDetections(canvas, resizedDetections);
          faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
        }, 100); 
      });
    }).catch(err => {
      statusText.innerText = "Error memuat file AI. Cek koneksi atau Console (F12).";
      statusText.style.color = "red";
      console.error("Gagal muat model:", err);
    });
  </script>
</body>
</html>
