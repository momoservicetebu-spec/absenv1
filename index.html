<!DOCTYPE html>
<html>
<head>
  <title>Gate Masuk - MFA Absensi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; position: relative; }
    #video-container { position: relative; display: none; margin-top: 15px; justify-content: center; }
    video { border-radius: 10px; background-color: #000; }
    canvas { position: absolute; border-radius: 10px; }
    .status { margin-top: 15px; font-size: 18px; font-weight: bold; }
    input { padding: 12px; font-size: 16px; text-align: center; width: 90%; border: 2px solid #007bff; border-radius: 5px; margin-top: 10px; box-sizing: border-box; }
    button.fp-btn { padding: 10px 20px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button.fp-btn:disabled { background-color: #ccc; cursor: not-allowed; }
    .alert-box { padding: 15px; margin-top: 15px; border-radius: 8px; display: none; font-weight: bold; color: white; }
    .method-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    
    /* Tombol Login Admin */
    .login-btn { display: inline-block; margin-top: 25px; padding: 10px 20px; background-color: #343a40; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; transition: 0.3s; }
    .login-btn:hover { background-color: #495057; }
    hr { border: 0; height: 1px; background: #ddd; margin-top: 25px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Terminal Absensi MFA</h2>
    <div class="status" id="statusText" style="color: orange;">Memuat Engine AI...</div>
    
    <!-- STATE 1: STANDBY -->
    <div id="standby-ui">
      <p><b>Pilih Metode Faktor Pertama:</b></p>
      
      <div class="method-box">
        <p style="margin: 0 0 10px 0; font-size: 14px;">📡 Tap Kartu NFC / Scan Barcode</p>
        <input type="text" id="nfcSimulator" placeholder="Fokus di sini & Ketik ID -> Enter" disabled autocomplete="off">
      </div>

      <div class="method-box">
        <p style="margin: 0 0 10px 0; font-size: 14px;">👆 Fingerprint (Localhost Bridge)</p>
        <button id="btnFingerprint" class="fp-btn" onclick="simulateFingerprintBridge()" disabled>Simulasikan Tempel Jari</button>
        <p id="fingerprintStatus" style="font-size: 13px; font-weight:bold; color: gray; margin-top: 10px;"></p>
      </div>
    </div>

    <!-- STATE 2: VERIFICATION -->
    <div id="video-container">
      <video id="video" width="480" height="360" autoplay muted playsinline></video>
    </div>

    <div class="alert-box" id="alertBox"></div>

    <hr>
    <!-- Link Menuju Halaman Login -->
    <a href="login.html" class="login-btn">⚙️ Masuk ke Dashboard Login</a>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxx3BLAOh7RZwF2vvukhDPhytbAPXfMP3H_RAJNeWgxLe2LNcCzojm-6HQ1kktPQMTQ/exec";
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
    
    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');
    const standbyUI = document.getElementById('standby-ui');
    const nfcInput = document.getElementById('nfcSimulator');
    const btnFingerprint = document.getElementById('btnFingerprint');
    const statusText = document.getElementById('statusText');
    const alertBox = document.getElementById('alertBox');

    let databaseWajah = []; 
    let currentMFAUser = null; 
    let verificationInterval = null;
    let isProcessing = false;

    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
      loadFaceDatabase()
    ]).then(() => {
      statusText.innerText = "Sistem Siap";
      statusText.style.color = "green";
      nfcInput.disabled = false;
      btnFingerprint.disabled = false;
      nfcInput.focus();
      startVideo();
    }).catch(err => {
      statusText.innerText = "Gagal memuat AI";
      console.error(err);
    });

    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => console.error(err));
    }

    async function loadFaceDatabase() {
      try {
        console.log("Mencoba mengunduh data wajah...");
        const formData = new URLSearchParams();
        formData.append("action", "getFaceReferences");
        const response = await fetch(GAS_URL, { method: "POST", body: formData });
        const result = await response.json();
        
        if (result.success && Array.isArray(result.data)) {
          result.data.forEach(item => {
            const keys = Object.keys(item);
            const embedKey = keys.find(k => k.toLowerCase().includes('embed') || k.toLowerCase().includes('vektor') || k.toLowerCase().includes('face'));
            const userKey = keys.find(k => k.toLowerCase().includes('id') || k.toLowerCase().includes('user'));
            
            if(embedKey && userKey) {
              const rawEmbed = item[embedKey];
              const userID = String(item[userKey]).trim();
              if (rawEmbed && rawEmbed !== "undefined") {
                try {
                  const parsed = typeof rawEmbed === 'string' ? JSON.parse(rawEmbed) : rawEmbed;
                  const descriptor = new Float32Array(parsed);
                  databaseWajah.push({ id: userID, descriptor: descriptor });
                } catch(e){}
              }
            }
          });
        }
      } catch (err) { console.error("Gagal load DB", err); }
    }

    nfcInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const inputID = this.value.trim();
        this.value = ''; 
        if (inputID === '') return;
        startVerificationState(inputID);
      }
    });

    function simulateFingerprintBridge() {
      if(isProcessing) return;
      const fpStatus = document.getElementById('fingerprintStatus');
      
      btnFingerprint.disabled = true;
      nfcInput.disabled = true;
      fpStatus.innerText = "Menunggu mesin fingerprint memproses...";
      fpStatus.style.color = "blue";

      setTimeout(() => {
        // GANTI TEXT INI DENGAN ID YANG VALID DI SHEET ANDA JIKA INGIN TES FINGERPRINT
        const detectedUserID = "FACE-1787924439928"; 
        fpStatus.innerText = `Sidik jari terdeteksi: ID ${detectedUserID}! Mengaktifkan Kamera...`;
        fpStatus.style.color = "green";

        setTimeout(() => {
          fpStatus.innerText = "";
          startVerificationState(detectedUserID);
        }, 1500);
      }, 1500);
    }

    function startVerificationState(userID) {
      if(isProcessing) return;
      isProcessing = true;

      const targetUser = databaseWajah.find(u => u.id === userID);
      
      if (!targetUser) {
        showAlert(`ID ${userID} tidak ditemukan di database wajah.`, "red");
        setTimeout(resetToStandby, 3000);
        return;
      }

      currentMFAUser = targetUser;
      
      standbyUI.style.display = 'none';
      videoContainer.style.display = 'flex';
      statusText.innerText = `Halo ${userID}, Verifikasi Wajah Anda...`;
      statusText.style.color = "blue";

      let canvas = document.querySelector('canvas');
      if(!canvas){
        canvas = faceapi.createCanvasFromMedia(video);
        videoContainer.append(canvas);
      }
      const displaySize = { width: video.width, height: video.height };
      faceapi.matchDimensions(canvas, displaySize);

      verificationInterval = setInterval(async () => {
        const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                        .withFaceLandmarks()
                                        .withFaceDescriptor();
        
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

        if (detections) {
          const resized = faceapi.resizeResults(detections, displaySize);
          faceapi.draw.drawDetections(canvas, resized);

          const distance = faceapi.euclideanDistance(detections.descriptor, currentMFAUser.descriptor);
          
          if (distance < 0.5) { 
            clearInterval(verificationInterval);
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            executeAttendance(currentMFAUser.id);
          }
        }
      }, 200);

      setTimeout(() => {
        if(isProcessing && verificationInterval) {
          clearInterval(verificationInterval);
          showAlert(`Verifikasi Wajah Gagal. Anda bukan ID ${userID}.`, "red");
          setTimeout(resetToStandby, 3000);
        }
      }, 10000);
    }

    async function executeAttendance(userID) {
      showAlert(`✅ Verifikasi MFA Sukses! Mencatat Absen...`, "#d39e00");
      statusText.innerText = "Mengirim Data...";

      try {
        const formData = new URLSearchParams();
        formData.append("action", "submitAutoAttendance");
        formData.append("userId", userID);
        formData.append("role", "GURU"); 
        formData.append("checkType", "IN");

        const response = await fetch(GAS_URL, { method: "POST", body: formData });
        const result = await response.json();

        if (result.success) {
          showAlert(`✅ ABSEN BERHASIL: ${userID}`, "green");
        } else {
          showAlert(`❌ Gagal Server: ${result.message}`, "red");
        }
      } catch (err) {
        showAlert(`❌ Network Error`, "red");
      }

      setTimeout(resetToStandby, 3000);
    }

    function resetToStandby() {
      clearInterval(verificationInterval);
      verificationInterval = null;
      currentMFAUser = null;
      isProcessing = false;
      
      const canvas = document.querySelector('canvas');
      if(canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

      hideAlert();
      videoContainer.style.display = 'none';
      standbyUI.style.display = 'block';
      statusText.innerText = "Sistem Siap";
      statusText.style.color = "green";
      
      nfcInput.disabled = false;
      btnFingerprint.disabled = false;
      nfcInput.focus();
    }

    function showAlert(text, color) {
      alertBox.style.display = "block";
      alertBox.style.backgroundColor = color;
      alertBox.innerText = text;
    }
    function hideAlert() { alertBox.style.display = "none"; }
  </script>
</body>
</html>
